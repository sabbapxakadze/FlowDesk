# Render Blueprint (ADR 0045, 0049): one free web service that serves the built web app, the API and Socket.IO on one address.
# NOTE: the live service (flowdesk on Render) was created BY HAND in the dashboard with these same values, not from this file: the Blueprint
# flow asked for a payment card up front and the manual flow did not stop at it (not tested whether the manual flow would have asked later).
# So this file is the written record of the settings, and the dashboard is where they actually live; keep the two in step.
# To create the service from it instead: New > Blueprint. The database is NOT here: it lives on Neon (its direct connection string goes into
# DATABASE_URL when Render asks for it). Values marked `sync: false` are asked for once, when the Blueprint is first created.
services:
  - type: web
    name: flowdesk
    runtime: node
    plan: free
    region: frankfurt # keep it close to the Neon database (also Frankfurt)
    healthCheckPath: /api/health # does not touch the database, so a check never wakes a sleeping Neon
    # Render detects pnpm by itself (its own default build command was pnpm), so no corepack step; `pnpm run build` builds contracts, the API
    # and the web app. This is the command the live service uses.
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    # NODE_ENV is set here, in the start command only, so the install above still gets the build tools (devDependencies).
    startCommand: NODE_ENV=production node apps/api/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: SERVE_WEB
        value: "true"
      - key: RUN_MIGRATIONS
        value: "true" # the schema is brought up to date when the server starts (under a database lock)
      - key: TRUST_PROXY
        value: "3" # 3 hops in front on Render (internal proxy, Cloudflare, ...): measured from a live x-forwarded-for with three addresses (ADR 0051)
      - key: DEMO_ENABLED
        value: "true" # "Try the demo" on the landing page; capped by DEMO_MAX_ACTIVE and rate limited (ADR 0044)
      - key: STORAGE_DRIVER
        value: s3 # files live in a Neon Object Storage bucket (ADR 0053); Render's free disk is wiped on restart
      - key: S3_ENDPOINT
        sync: false # https://br-<branch>.storage.c-<n>.eu-central-1.aws.neon.tech
      - key: S3_REGION
        value: eu-central-1
      - key: S3_BUCKET
        value: flowdesk-files # a hyphen: an underscore here gave 400 InvalidArgument on the first live try
      - key: S3_ACCESS_KEY_ID
        sync: false # a Neon credential with storage:read and storage:write
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: LOG_LEVEL
        value: info
      # APP_URL is not set: the server takes Render's own address (RENDER_EXTERNAL_URL). Set APP_URL later for a custom domain.
      - key: DATABASE_URL
        sync: false # the Neon DIRECT connection string (hostname without "-pooler")
      - key: RESEND_API_KEY
        sync: false # a placeholder until a domain exists (emails fail quietly and are logged)
      - key: JWT_SECRET
        generateValue: true
      - key: ATTACHMENT_SIGNING_SECRET
        generateValue: true
